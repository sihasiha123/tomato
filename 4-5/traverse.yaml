  # 16 -> 1 需要 15 次横移。
  # 用户接口定义: 负数=向左, 正数=向右。
  # 当前列表由上面的实测 y 差换算得到；traverse 仍按 lateral_distances_mm 执行横移。
  lateral_move_count: 15
  lateral_distances_mm:
